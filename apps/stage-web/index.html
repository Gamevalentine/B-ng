    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="description" content="BÔNG: thử nghiệm giao diện trợ lý AI tiếng Việt trên trình duyệt. Chưa phải bản Windows hoàn chỉnh.">
    <meta name="apple-mobile-web-app-title" content="BÔNG" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="rgb(18,18,18)" id="themeColor" />

    <!-- Open Graph Protocol -->
    <meta property="og:title" content="AIRI">
    <meta property="og:site_name" content="AIRI">
    <meta property="og:description" content="BÔNG Web Demo — kiểm thử giao diện, nhân vật và tương thích trình duyệt.">

    <!-- Open Graph Protocol extension, Twitter cards -->
    <meta name="twitter:title" content="AIRI">

    <meta name="twitter:card" content="summary_large_image">
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'light' || (prefersDark && setting !== 'dark'))
          document.querySelector('#themeColor')?.setAttribute('content', 'rgb(255,255,255)')
      })()
    </script>
    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)
      })()
    </script>
    <script src="%BASE_URL%assets/js/CubismSdkForWeb-5-r.3/Core/live2dcubismcore.min.js"></script>
  </head>
