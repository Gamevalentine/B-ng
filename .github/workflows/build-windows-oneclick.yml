name: BONG Windows Preview (manual only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      VITE_ENABLE_POSTHOG: 'false'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify BONG source and model packaging before build
        shell: pwsh
        run: |
          $expected = @(
            'apps/stage-tamagotchi/src/main/services/electron/bong-zero-tts.ts'
            'apps/stage-tamagotchi/src/renderer/utils/bong-transcript.ts'
            'packages/provider-inference/src/providers/local/bong-zerotts/index.ts'
            'apps/stage-tamagotchi/build/bong-bundle-ready.json'
          )
          $missing = @($expected | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            throw "BONG local source has NOT been migrated to GitHub. Missing: $($missing -join ', '). Do not package AIRI as BONG."
          }
          $ready = Get-Content 'apps/stage-tamagotchi/build/bong-bundle-ready.json' -Raw | ConvertFrom-Json
          if ($ready.windowsRuntimeBundled -ne $true -or
              $ready.maiChiModelHandled -ne $true -or
              $ready.sherpaModelHandled -ne $true) {
            throw 'BONG runtime packaging not confirmed. This workflow must not create an installer yet.'
          }
          "BONG source readiness and runtime packaging gates passed." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Setup pnpm + Node
        uses: pnpm/setup@v2
        with:
          runtime: node@26.7.0
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace packages
        run: pnpm run build:packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.1'
          use-dotnet: true
          include-templates: true

      - name: Export Godot stage
        working-directory: ./engines/stage-tamagotchi-godot
        shell: bash
        run: |
          mkdir -p out/win
          godot --headless --export-release "Windows Desktop" out/win/godot-stage.exe

      - name: Build AIRI Windows x64 installer
        shell: pwsh
        run: |
          pnpm run -F @proj-airi/stage-tamagotchi build
          pnpm -F @proj-airi/stage-tamagotchi exec electron-builder build --windows --x64 --publish=never

      - name: Show produced files
        shell: pwsh
        run: Get-ChildItem apps/stage-tamagotchi/dist -Recurse | Select-Object FullName,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: BONG-Windows-x64-PREVIEW
          path: apps/stage-tamagotchi/dist/*windows-x64-setup.exe
          if-no-files-found: error
          retention-days: 7
